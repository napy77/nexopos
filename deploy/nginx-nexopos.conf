# NexoPOS · nginx para nexopos.app
# El bloque HTTPS lo agrega certbot automáticamente:
#   certbot --nginx -d nexopos.app -d www.nexopos.app

server {
    listen 80;
    listen [::]:80;
    server_name nexopos.app www.nexopos.app;

    # API directo al backend (evita doble proxy por Next.js)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Todo lo demás al frontend Next.js
    # /entrar trae en la query un código de un solo uso para entrar a la caja
    # de un comercio sin contraseña (NexoB2B, modo soporte). No se registra:
    # un access log con esa URL es una lista de llaves, aunque venzan rápido.
    # El ingreso queda en audit_log (auth.entrar*) y en la tabla de B2B.
    location = /entrar {
        access_log off;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10m;
}
